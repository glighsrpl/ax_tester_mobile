wcag_version: "2.2"
output_requirements:
  - "For each issue: id, wcag_rule, description, severity, source, confidence, html_snippet, fix, why_this_matters, potential_exposures."
  - "why_this_matters must be one concise, plain-language sentence about why the issue affects users."
  - "potential_exposures must be a list of objects with category and description strings; keep categories short and descriptions concise."
  - "Do not include extra keys beyond the required schema."
  - "Do not report criteria from other levels than the one requested."
  - "If not applicable: skip and do not output an issue."

levels:

  A:
    scope: "WCAG 2.2 Level A Success Criteria only"
    success_criteria:

      - id: "1.1.1"
        title: "Non-text Content"
        level: "A"
        description: >
          All non-text content (images, icons, charts, CAPTCHA, controls) must have a text
          alternative that serves the equivalent purpose, or an equivalent mechanism.
        examples:
          pass:
            - "Informative image with meaningful alt: alt='Q4 sales chart up 12%'."
            - "Search icon button with accessible name 'Search' (e.g., visible label or aria-label)."
          fail:
            - "Informative image missing alt or with meaningless alt like 'image123'."
            - "Icon-only button with no label/accessible name."
        how_to_test:
          - "Inspect DOM: verify alt on <img>; verify accessible names for controls."
          - "With a screen reader: non-text content should be understandable."
        common_fixes:
          - "Add meaningful alt text, or alt='' for purely decorative images."
          - "Add a visible label or aria-label/aria-labelledby for icon controls."

      - id: "1.2.1"
        title: "Audio-only and Video-only (Prerecorded)"
        level: "A"
        description: >
          For prerecorded audio-only and prerecorded video-only media, provide an equivalent
          alternative (typically a transcript for audio-only; a text alternative for video-only).
        examples:
          pass:
            - "Prerecorded podcast with a complete transcript."
            - "Silent instructional video with a text description of the visual content."
          fail:
            - "Prerecorded audio with no transcript."
            - "Video-only content with no alternative."
        how_to_test:
          - "Check that a transcript or equivalent alternative is available near the media."
        common_fixes:
          - "Create and publish a complete transcript or media alternative page."

      - id: "1.2.2"
        title: "Captions (Prerecorded)"
        level: "A"
        description: >
          Prerecorded video with audio must have synchronized captions for speech and relevant sounds.
        examples:
          pass:
            - "Tutorial video with accurate, well-timed captions."
          fail:
            - "Video has audio but no captions."
        how_to_test:
          - "Enable captions and verify accuracy, synchronization, and coverage."
        common_fixes:
          - "Add caption tracks (e.g., WebVTT) and fix timing/text errors."

      - id: "1.2.3"
        title: "Audio Description or Media Alternative (Prerecorded)"
        level: "A"
        description: >
          For prerecorded video, provide audio description or a media alternative that includes
          essential visual information not conveyed through audio.
        examples:
          pass:
            - "Video includes audio description of key visuals and on-screen text."
            - "A full text alternative describes all essential visuals."
          fail:
            - "Key visual info (charts, on-screen instructions) is not available to non-visual users."
        how_to_test:
          - "Check whether essential visual info is available without seeing the video."
        common_fixes:
          - "Add an audio description track or provide a complete text alternative."

      - id: "1.3.1"
        title: "Info and Relationships"
        level: "A"
        description: >
          Information, structure, and relationships (headings, lists, tables, form labels, groups)
          must be programmatically determinable or available in text.
        examples:
          pass:
            - "Form fields with properly associated <label for='...'>."
            - "Headings use h1-h2 hierarchy; lists use <ul>/<ol>."
          fail:
            - "Visual headings built with <div> + CSS only."
            - "Inputs with no associated labels."
        how_to_test:
          - "Inspect markup for semantic structure and label associations."
          - "With a screen reader: heading navigation and form field reading should work."
        common_fixes:
          - "Use semantic HTML; associate labels; use proper table headers (<th> with scope)."

      - id: "1.3.2"
        title: "Meaningful Sequence"
        level: "A"
        description: >
          When reading order affects meaning, the DOM/reading order must be correct even without styling.
        examples:
          pass:
            - "Two-column layout where DOM order matches the intended reading order."
          fail:
            - "DOM order reads sidebar before main content causing confusion, while CSS reorders visually."
        how_to_test:
          - "Disable CSS or review linear reading with a screen reader; verify logical order."
        common_fixes:
          - "Fix DOM order; avoid CSS reordering that breaks reading sequence."

      - id: "1.3.3"
        title: "Sensory Characteristics"
        level: "A"
        description: >
          Instructions must not rely solely on sensory characteristics such as shape, size, visual
          location, orientation, or sound (e.g., 'click the red button on the right').
        examples:
          pass:
            - "“Select **Continue** (button at the end of the form)”."
          fail:
            - "“Press the green button” with no other identifier."
        how_to_test:
          - "Review instructions: would they make sense without color/position cues?"
        common_fixes:
          - "Reference controls by label/name; add clear text identifiers."

      - id: "1.4.1"
        title: "Use of Color"
        level: "A"
        description: >
          Color must not be the only visual means of conveying information, indicating an action,
          prompting a response, or distinguishing a visual element.
        examples:
          pass:
            - "Errors shown with red color + icon + text message."
          fail:
            - "Required fields indicated only by a red border."
        how_to_test:
          - "Simulate color blindness or remove color cues: is information still conveyed?"
        common_fixes:
          - "Add text, icons, patterns, underlines for links, explicit error messages."

      - id: "1.4.2"
        title: "Audio Control"
        level: "A"
        description: >
          If audio plays automatically for more than 3 seconds, provide a mechanism to pause/stop
          or control volume independently of the system volume.
        examples:
          pass:
            - "Autoplay video provides immediate pause and volume controls."
          fail:
            - "Background music autoplay with no controls."
        how_to_test:
          - "Load the page: if audio starts, can you immediately pause/stop/control it?"
        common_fixes:
          - "Disable autoplay audio; add accessible player controls."

      - id: "2.1.1"
        title: "Keyboard"
        level: "A"
        description: >
          All functionality must be operable through a keyboard interface without requiring
          specific timings for individual keystrokes.
        examples:
          pass:
            - "Menus, dialogs, and dropdowns work via Tab/Enter/Escape."
          fail:
            - "Drag-and-drop is the only way to complete a task."
        how_to_test:
          - "Use keyboard only: can you complete key user journeys end-to-end?"
        common_fixes:
          - "Add keyboard support and non-drag alternatives; prefer native controls."

      - id: "2.1.2"
        title: "No Keyboard Trap"
        level: "A"
        description: >
          Keyboard focus must not be trapped in any component; users must be able to move focus away
          using standard keys.
        examples:
          pass:
            - "Modal dialog traps focus correctly and provides a close button and Escape."
          fail:
            - "Widget captures Tab and users cannot exit."
        how_to_test:
          - "Tab/Shift+Tab through components; confirm you can always exit."
        common_fixes:
          - "Implement correct focus management and provide an escape mechanism."
        
      - id: "2.1.4"
        title: "Character Key Shortcuts"
        level: "A"
        description: >
          Single-character key shortcuts must be disableable, remappable, or active only when the component has focus.
        examples:
          pass:
            - "Single-key shortcuts only work when the editor has focus or can be turned off."
          fail:
            - "Pressing 'S' anywhere triggers an action while typing in a field."
        how_to_test:
            - "Type in inputs and use speech input; ensure shortcuts do not trigger unexpectedly."
        common_fixes:
            - "Require modifiers, scope to focus, and provide settings to disable/remap."

      - id: "2.2.1"
        title: "Timing Adjustable"
        level: "A"
        description: >
          If there is a time limit, users must be able to turn off, adjust, or extend it,
          except for certain exceptions (real-time events, security, etc.).
        examples:
          pass:
            - "Session timeout warns users and lets them extend time."
          fail:
            - "Form expires after 60 seconds with no extension option."
        how_to_test:
          - "Identify time limits: is there a way to extend/disable/adjust?"
        common_fixes:
          - "Provide timeout extensions, save drafts, and warn before expiry."

      - id: "2.2.2"
        title: "Pause, Stop, Hide"
        level: "A"
        description: >
          Moving, blinking, scrolling, or auto-updating information that starts automatically and lasts
          more than 5 seconds must have a mechanism to pause, stop, or hide it.
        examples:
          pass:
            - "Carousel has a pause button and manual controls."
          fail:
            - "Auto-scrolling ticker cannot be paused."
        how_to_test:
          - "Find motion/auto-update content: can you pause/stop/hide it?"
        common_fixes:
          - "Add pause/stop controls; disable auto-advance; reduce animation."

      - id: "2.3.1"
        title: "Three Flashes or Below Threshold"
        level: "A"
        description: >
          Content must not flash in a way that exceeds the defined thresholds (reducing risk of seizures).
        examples:
          pass:
            - "Animations avoid rapid flashes."
          fail:
            - "Strobe-like flashing banner."
        how_to_test:
          - "Review flashing content; use a flash analysis tool if needed."
        common_fixes:
          - "Remove/soften flashing; reduce contrast and frequency."

      - id: "2.4.1"
        title: "Bypass Blocks"
        level: "A"
        description: >
          Provide a way to bypass repeated blocks of content (e.g., skip links, landmarks).
        examples:
          pass:
            - "‘Skip to main content’ link appears on focus."
          fail:
            - "Keyboard users must tab through long navigation on every page."
        how_to_test:
          - "Keyboard test: is there a skip link or <main> landmark?"
        common_fixes:
          - "Add a skip link and proper landmarks (e.g., <main>)."

      - id: "2.4.2"
        title: "Page Titled"
        level: "A"
        description: >
          Web pages must have descriptive titles (the HTML <title> element).
        examples:
          pass:
            - "<title>Invoices - Customer Portal</title>"
          fail:
            - "<title>Home</title> used for many different pages."
        how_to_test:
          - "Check browser tab title and DOM <title> for uniqueness/meaningfulness."
        common_fixes:
          - "Set unique, descriptive titles per page/route."

      - id: "2.4.3"
        title: "Focus Order"
        level: "A"
        description: >
          Focus must move in an order that preserves meaning and operability.
        examples:
          pass:
            - "Tab order follows the visual and logical form sequence."
          fail:
            - "Focus jumps unpredictably across regions."
        how_to_test:
          - "Tab/Shift+Tab: confirm a predictable, logical order."
        common_fixes:
          - "Fix DOM order; avoid tabindex > 0; manage focus in custom widgets."

      - id: "2.4.4"
        title: "Link Purpose (In Context)"
        level: "A"
        description: >
          The purpose of each link must be determinable from the link text alone or from its context.
        examples:
          pass:
            - "“Download 2025 report (PDF)”"
          fail:
            - "Multiple “Click here” links without context."
        how_to_test:
          - "Review links in their surrounding context: is intent clear?"
        common_fixes:
          - "Make link text descriptive; avoid generic phrases."

      - id: "2.5.1"
        title: "Pointer Gestures"
        level: "A"
        description: >
          Functionality that uses multipoint or path-based gestures must have a single-pointer alternative.
        examples:
          pass:
            - "Zoom supports buttons (+/-) in addition to pinch."
          fail:
            - "Carousel navigation is swipe-only."
        how_to_test:
          - "Attempt tasks without complex gestures; confirm alternatives exist."
        common_fixes:
          - "Add equivalent controls (buttons)."

      - id: "2.5.2"
        title: "Pointer Cancellation"
        level: "A"
        description: >
          For pointer input, actions should be completed on the up-event, or provide a way to abort/undo
          before completion (especially for non-essential actions).
        examples:
          pass:
            - "Action triggers on click/up; moving pointer away cancels."
          fail:
            - "Critical action triggers on mousedown with no cancel."
        how_to_test:
          - "Check if actions fire on down-event; confirm cancel/undo is possible."
        common_fixes:
          - "Trigger on click/up; add confirmation for critical actions."

      - id: "2.5.3"
        title: "Label in Name"
        level: "A"
        description: >
          When a control has a visible label, the accessible name must contain that same text.
        examples:
          pass:
            - "Visible label “Search”; accessible name includes “Search”."
          fail:
            - "Visible “Search” but aria-label is “Find”."
        how_to_test:
          - "Use accessibility inspector: compare visible label vs accessible name."
        common_fixes:
          - "Align aria-label/aria-labelledby with the visible label."

      - id: "2.5.4"
        title: "Motion Actuation"
        level: "A"
        description: >
          Functionality triggered by device motion must have an alternative and allow users to disable motion activation.
        examples:
          pass:
            - "Undo available via button; shake is optional and can be disabled."
          fail:
            - "Undo is only possible by shaking the device."
        how_to_test:
          - "Identify motion-based triggers and confirm alternatives and disable controls."
        common_fixes:
          - "Provide equivalent UI controls; add a setting to disable motion."

      - id: "3.1.1"
        title: "Language of Page"
        level: "A"
        description: >
          The default human language of each page must be programmatically determinable (e.g., <html lang='en'>).
        examples:
          pass:
            - "<html lang='en'>"
          fail:
            - "Missing lang attribute on the root html element."
        how_to_test:
          - "Inspect <html lang> and confirm it matches the primary content language."
        common_fixes:
          - "Set the correct lang attribute per page."

      - id: "3.2.1"
        title: "On Focus"
        level: "A"
        description: >
          Changing focus must not cause unexpected context changes (navigation, new windows, auto-submit).
        examples:
          pass:
            - "Focusing a dropdown does not navigate until user confirms."
          fail:
            - "Tabbing into a field triggers navigation automatically."
        how_to_test:
          - "Keyboard navigation: verify no unexpected actions on focus."
        common_fixes:
          - "Remove focus side effects; require explicit activation."

      - id: "3.2.2"
        title: "On Input"
        level: "A"
        description: >
          Changing input values must not cause unexpected context changes without warning.
        examples:
          pass:
            - "Selecting a filter requires clicking ‘Apply’."
          fail:
            - "Changing a select triggers immediate navigation without warning."
        how_to_test:
          - "Change inputs and observe whether context changes unexpectedly."
        common_fixes:
          - "Add confirmation/apply steps; warn users before changes."

      - id: "3.3.1"
        title: "Error Identification"
        level: "A"
        description: >
          If an input error is detected, it must be identified and described to the user in text.
        examples:
          pass:
            - "“Email address is invalid” message associated with the field."
          fail:
            - "Only a red border indicates an error; no message."
        how_to_test:
          - "Submit invalid data and verify clear, localized error messages."
        common_fixes:
          - "Provide text messages; use aria-describedby; add error summary where appropriate."

      - id: "3.3.2"
        title: "Labels or Instructions"
        level: "A"
        description: >
          Provide labels or instructions when content requires user input (including required fields and formats).
        examples:
          pass:
            - "Label “Tax ID” plus a format hint."
          fail:
            - "No label; placeholder-only input."
        how_to_test:
          - "Check each input has a persistent label and necessary instructions."
        common_fixes:
          - "Add <label>; provide hints and associate them programmatically."

      - id: "4.1.2"
        title: "Name, Role, Value"
        level: "A"
        description: >
          For custom UI components, the name, role, and value/state must be programmatically determinable,
          and updates must be exposed to assistive technologies.
        examples:
          pass:
            - "Custom switch uses role='switch' with aria-checked updated on toggle."
          fail:
            - "Clickable <div> with no role/state exposed."
        how_to_test:
          - "Check accessibility tree for role/name/state and confirm updates on interaction."
        common_fixes:
          - "Use native elements where possible; otherwise implement correct ARIA patterns."

  AA:
    scope: "WCAG 2.2 Level AA Success Criteria only"
    success_criteria:

      - id: "1.2.4"
        title: "Captions (Live)"
        level: "AA"
        description: "Live video content with audio must provide captions."
        examples:
          pass: ["Live stream includes accurate live captions."]
          fail: ["Live event has no captions."]
        how_to_test: ["During the live stream, confirm captions are present and usable."]
        common_fixes: ["Integrate live captioning/stenography services."]

      - id: "1.2.5"
        title: "Audio Description (Prerecorded)"
        level: "AA"
        description: "Prerecorded video must provide audio description."
        examples:
          pass: ["A selectable audio description track is available."]
          fail: ["No audio description for key visual-only information."]
        how_to_test: ["Confirm audio description track exists and covers key visuals."]
        common_fixes: ["Produce and publish an audio description track."]

      - id: "1.3.4"
        title: "Orientation"
        level: "AA"
        description: "Content must not restrict its view and operation to a single display orientation unless essential."
        examples:
          pass: ["Works in both portrait and landscape."]
          fail: ["Forced landscape without an essential reason."]
        how_to_test: ["Rotate device/emulator and verify usability."]
        common_fixes: ["Remove orientation locks; implement responsive layouts."]

      - id: "1.3.5"
        title: "Identify Input Purpose"
        level: "AA"
        description: >
          Input fields that collect user information must identify their purpose (e.g., via HTML autocomplete tokens),
          enabling personalization and autofill support.
        examples:
          pass: ["Email field uses autocomplete='email'."]
          fail: ["User info fields have no autocomplete/purpose identification."]
        how_to_test: ["Inspect inputs for appropriate autocomplete tokens."]
        common_fixes: ["Add correct autocomplete tokens (name, email, address, etc.)."]

      - id: "1.4.3"
        title: "Contrast (Minimum)"
        level: "AA"
        description: >
          Text contrast must be at least 4.5:1 for normal text and 3:1 for large text (with defined exceptions).
        examples:
          pass: ["Dark text on white background meets contrast ratio."]
          fail: ["Light gray text on white fails contrast."]
        how_to_test: ["Measure contrast using computed colors and a contrast checker."]
        common_fixes: ["Adjust text/background colors; increase font size/weight as needed."]

      - id: "1.4.4"
        title: "Resize text"
        level: "AA"
        description: "Text must be resizable up to 200% without loss of content or functionality."
        examples:
          pass: ["At 200% zoom, layout remains readable and usable."]
          fail: ["At 200% zoom, text overlaps or controls become unusable."]
        how_to_test: ["Set browser zoom to 200% and verify no loss of content/functionality."]
        common_fixes: ["Use responsive layouts; avoid fixed-height containers; use relative units."]

      - id: "1.4.5"
        title: "Images of Text"
        level: "AA"
        description: "Do not use images of text when the same visual presentation can be achieved with real text (exceptions apply)."
        examples:
          pass: ["Heading is real HTML text styled with CSS."]
          fail: ["Banner contains critical text only inside an image."]
        how_to_test: ["Identify rasterized text; check whether it could be real text."]
        common_fixes: ["Replace images of text with real text; keep logos as allowed exceptions."]

      - id: "1.4.10"
        title: "Reflow"
        level: "AA"
        description: >
          Content must reflow at 320 CSS pixels width (or 400% zoom) without requiring horizontal scrolling
          for reading and operating content (exceptions apply).
        examples:
          pass: ["On narrow viewports, content becomes single-column with no horizontal scroll for text."]
          fail: ["Layout forces horizontal scrolling for standard text content."]
        how_to_test: ["Use 320px viewport or 400% zoom and check for unnecessary horizontal scrolling."]
        common_fixes: ["Implement responsive CSS; avoid fixed widths; allow wrapping."]

      - id: "1.4.11"
        title: "Non-text Contrast"
        level: "AA"
        description: >
          UI components and graphical objects needed to understand content must have at least 3:1 contrast
          against adjacent colors (including focus indicators, borders, icons).
        examples:
          pass: ["Input border and focus ring are clearly visible."]
          fail: ["Focus indicator is too faint to perceive."]
        how_to_test: ["Measure contrast for UI boundaries/indicators in normal and focus states."]
        common_fixes: ["Increase contrast of borders/icons/focus styles."]

      - id: "1.4.12"
        title: "Text Spacing"
        level: "AA"
        description: >
          Content must remain readable and functional when text spacing is increased to specified values
          (line height, paragraph spacing, letter/word spacing).
        examples:
          pass: ["With increased spacing, text does not clip or overlap."]
          fail: ["Increased spacing causes clipping or overlapping controls."]
        how_to_test: ["Apply a text spacing stylesheet/bookmarklet and verify layout stability."]
        common_fixes: ["Avoid fixed heights; ensure containers expand; handle overflow properly."]

      - id: "1.4.13"
        title: "Content on Hover or Focus"
        level: "AA"
        description: >
          Additional content shown on hover/focus must be dismissible, hoverable, and persistent
          until the user dismisses it or focus/hover moves away appropriately.
        examples:
          pass: ["Tooltip can be dismissed with Escape and remains visible while hovered/focused."]
          fail: ["Tooltip disappears immediately, preventing interaction or reading."]
        how_to_test: ["Test with mouse and keyboard: can you keep, interact with, and dismiss the content?"]
        common_fixes: ["Add dismiss mechanisms; keep content visible on hover/focus; avoid premature dismissal."]

      - id: "2.4.5"
        title: "Multiple Ways"
        level: "AA"
        description: "Provide more than one way to locate a page within a set of pages (exceptions apply)."
        examples:
          pass: ["Primary navigation plus site search."]
          fail: ["Only a single, non-discoverable navigation path exists."]
        how_to_test: ["Check for search, sitemap, navigation, or other findability mechanisms."]
        common_fixes: ["Add search, sitemap, breadcrumbs, or multiple navigation routes."]

      - id: "2.4.6"
        title: "Headings and Labels"
        level: "AA"
        description: "Headings and labels must describe topic or purpose."
        examples:
          pass: ["Heading: 'Invoice details' for the invoice section."]
          fail: ["Generic headings like 'Section 1'."]
        how_to_test: ["Review headings/labels for clarity and specificity."]
        common_fixes: ["Rewrite headings/labels to be descriptive and consistent."]

      - id: "2.4.7"
        title: "Focus Visible"
        level: "AA"
        description: "Keyboard focus must be visible."
        examples:
          pass: ["Clear focus ring on all interactive elements."]
          fail: ["Focus outline removed without a replacement."]
        how_to_test: ["Navigate with Tab and confirm focus is always clearly visible."]
        common_fixes: ["Restore default outline or implement strong custom focus styles."]

      - id: "2.5.7"
        title: "Dragging Movements"
        level: "AA"
        description: "If an action requires dragging, provide an alternative that does not require dragging (exceptions apply)."
        examples:
          pass: ["Reorder list provides 'Move up/down' buttons."]
          fail: ["Reordering is drag-only with no alternative."]
        how_to_test: ["Attempt the task without dragging and verify an alternative exists."]
        common_fixes: ["Add buttons/menus/inputs as non-drag alternatives."]

      - id: "2.5.8"
        title: "Target Size (Minimum)"
        level: "AA"
        description: >
          Pointer targets must be at least 24 by 24 CSS pixels, with defined exceptions (e.g., inline text links).
        examples:
          pass: ["Icon button has >=24px hit area via padding."]
          fail: ["16px icon with no padding; very small hit area."]
        how_to_test: ["Measure the clickable/tappable hit area on mobile-sized viewports."]
        common_fixes: ["Increase padding/spacing; enlarge hit area without changing visuals if needed."]

      - id: "3.1.2"
        title: "Language of Parts"
        level: "AA"
        description: "The human language of passages or phrases must be programmatically determinable when it differs from the page language."
        examples:
          pass: ["<span lang='fr'>Bonjour</span> within an English page."]
          fail: ["Foreign language phrases not marked up."]
        how_to_test: ["Identify language changes and verify lang markup on those segments."]
        common_fixes: ["Add appropriate lang attributes to differing-language segments."]

      - id: "3.2.3"
        title: "Consistent Navigation"
        level: "AA"
        description: "Repeated navigation mechanisms must occur in the same relative order each time they are repeated."
        examples:
          pass: ["Main navigation stays consistent across pages."]
          fail: ["Navigation items reorder unpredictably between pages."]
        how_to_test: ["Compare templates across pages for consistent navigation placement/order."]
        common_fixes: ["Standardize navigation patterns via a design system/layout templates."]

      - id: "3.2.4"
        title: "Consistent Identification"
        level: "AA"
        description: "Components with the same functionality must be identified consistently."
        examples:
          pass: ["The same icon/label is used consistently for 'Search'."]
          fail: ["Same action labeled 'Search' in one place and 'Find' in another without reason."]
        how_to_test: ["Check repeated controls for consistent labels/icons/names."]
        common_fixes: ["Align naming and iconography; enforce component reuse."]

      - id: "3.3.3"
        title: "Error Suggestion"
        level: "AA"
        description: "If an input error is detected and suggestions for correction are known, provide them to the user."
        examples:
          pass: ["“Password must be at least 12 characters”."]
          fail: ["Generic “Invalid input” message with no guidance."]
        how_to_test: ["Trigger common errors and evaluate whether guidance is actionable."]
        common_fixes: ["Use precise error messages; provide format examples and constraints."]

      - id: "3.3.4"
        title: "Error Prevention (Legal, Financial, Data)"
        level: "AA"
        description: >
          For legal/financial commitments or modifying user-controllable data, provide at least one:
          reversible submissions, opportunity to correct errors, or a review/confirmation step.
        examples:
          pass: ["Review page before confirming a payment."]
          fail: ["One-click irreversible submission with no review/undo."]
        how_to_test: ["Simulate critical submissions and verify review/confirm/undo or correction is available."]
        common_fixes: ["Add a review step, confirmation dialog, undo window, and robust validation."]

      - id: "4.1.3"
        title: "Status Messages"
        level: "AA"
        description: >
          Status messages must be programmatically determinable through role or properties so that
          assistive technologies can present them without moving focus (e.g., aria-live regions).
        examples:
          pass: ["“Saved successfully” toast uses role='status' / aria-live='polite'."]
          fail: ["Visual status updates are not announced to screen readers."]
        how_to_test: ["Perform actions that trigger status changes and confirm screen readers announce them."]
        common_fixes: ["Use aria-live/role='status'/'alert' properly; ensure messages are inserted/updated correctly."]

  AAA:
    scope: "WCAG 2.2 Level AAA Success Criteria only"
    success_criteria:

      - id: "1.2.6"
        title: "Sign Language (Prerecorded)"
        level: "AAA"
        description: "Provide sign language interpretation for all prerecorded audio content in synchronized media."
        examples:
          pass: ["Prerecorded video includes a sign-language interpreter overlay/track."]
          fail: ["No sign-language version is available."]
        how_to_test: ["Verify a sign-language alternative is provided for prerecorded videos with speech."]
        common_fixes: ["Produce a sign-language interpreted version or overlay."]

      - id: "1.2.7"
        title: "Extended Audio Description (Prerecorded)"
        level: "AAA"
        description: "Provide extended audio description for prerecorded video when pauses are needed to describe visuals."
        examples:
          pass: ["An extended AD version is available where the video pauses to add descriptions."]
          fail: ["Dense visual info cannot be described adequately with standard AD; no extended version exists."]
        how_to_test: ["Assess whether standard AD is sufficient; if not, confirm extended AD exists."]
        common_fixes: ["Produce an extended audio description version."]

      - id: "1.2.8"
        title: "Media Alternative (Prerecorded)"
        level: "AAA"
        description: "Provide a full text alternative for all prerecorded synchronized media."
        examples:
          pass: ["Complete text alternative includes dialogue and essential visual descriptions."]
          fail: ["Only a short summary is provided."]
        how_to_test: ["Compare the alternative against the media for completeness."]
        common_fixes: ["Create a comprehensive transcript/media alternative page."]

      - id: "1.2.9"
        title: "Audio-only (Live)"
        level: "AAA"
        description: "Provide a text alternative (e.g., real-time transcription) for live audio-only content."
        examples:
          pass: ["Live audio event provides real-time transcription."]
          fail: ["No text alternative for live audio."]
        how_to_test: ["During a live audio event, confirm real-time text alternatives exist."]
        common_fixes: ["Integrate live transcription/stenography."]

      - id: "1.3.6"
        title: "Identify Purpose"
        level: "AAA"
        description: >
          The purpose of user interface components, icons, and regions should be identifiable to support
          personalization and adaptation (where applicable).
        examples:
          pass: ["Key regions/components expose consistent semantic purpose information where supported."]
          fail: ["Complex UI provides no way to identify purposes consistently."]
        how_to_test: ["Review whether supported purpose/semantics are provided consistently across UI."]
        common_fixes: ["Align component semantics and purpose metadata with applicable patterns/specs."]

      - id: "1.4.6"
        title: "Contrast (Enhanced)"
        level: "AAA"
        description: "Provide enhanced contrast: at least 7:1 for normal text and 4.5:1 for large text (exceptions apply)."
        examples:
          pass: ["Normal text meets >= 7:1 contrast."]
          fail: ["Text meets AA but not AAA contrast thresholds."]
        how_to_test: ["Measure contrast ratios against AAA thresholds."]
        common_fixes: ["Adjust palette to increase contrast further."]

      - id: "1.4.7"
        title: "Low or No Background Audio"
        level: "AAA"
        description: "For prerecorded speech audio, background sounds should be low enough not to interfere, or be removable."
        examples:
          pass: ["Speech is clear; background track is absent/very low or separable."]
          fail: ["Background music competes with speech."]
        how_to_test: ["Evaluate speech intelligibility and background levels."]
        common_fixes: ["Remix audio, lower background, separate tracks."]

      - id: "1.4.8"
        title: "Visual Presentation"
        level: "AAA"
        description: >
          Provide enhanced control over text presentation (e.g., width/spacing/colors) and avoid fully justified text.
        examples:
          pass: ["Readable line lengths and no forced full justification; supports user styling."]
          fail: ["Very long lines, full justification, and prevents user customization."]
        how_to_test: ["Check line length constraints and whether user styles can be applied effectively."]
        common_fixes: ["Use readable max-width, avoid justify, support themes/user styles."]

      - id: "1.4.9"
        title: "Images of Text (No Exception)"
        level: "AAA"
        description: "Do not use images of text at all (no exceptions)."
        examples:
          pass: ["All informative text is real text."]
          fail: ["Headings/claims are embedded in images."]
        how_to_test: ["Scan UI for text embedded in images and verify none is used for information."]
        common_fixes: ["Replace with real text and CSS styling."]

      - id: "2.1.3"
        title: "Keyboard (No Exception)"
        level: "AAA"
        description: "All functionality must be operable through a keyboard interface with no exceptions."
        examples:
          pass: ["Even complex widgets (canvas/editor) provide full keyboard alternatives."]
          fail: ["Some interactions are mouse-only with no keyboard alternative."]
        how_to_test: ["Complete all flows with keyboard only, including advanced components."]
        common_fixes: ["Provide keyboard-operable alternatives; implement accessible widget patterns."]

      - id: "2.2.3"
        title: "No Timing"
        level: "AAA"
        description: "Do not require timed responses unless essential."
        examples:
          pass: ["No mandatory timers; timers can be fully disabled."]
          fail: ["Timed task is mandatory with no alternative."]
        how_to_test: ["Identify any timed interactions and confirm they are not required or are avoidable."]
        common_fixes: ["Remove time limits or provide non-timed alternatives."]

      - id: "2.2.4"
        title: "Interruptions"
        level: "AAA"
        description: "Allow users to postpone or suppress interruptions, except for emergencies."
        examples:
          pass: ["Notifications are deferable and configurable."]
          fail: ["Frequent blocking popups cannot be disabled."]
        how_to_test: ["Trigger notifications and verify user control to postpone/suppress."]
        common_fixes: ["Add user preferences, do-not-disturb, and avoid modal interruptions."]

      - id: "2.2.5"
        title: "Re-authenticating"
        level: "AAA"
        description: "After re-authentication, users should be able to continue without losing data."
        examples:
          pass: ["Session expires -> login -> restores previous state and input."]
          fail: ["Session expires and all entered data is lost."]
        how_to_test: ["Let session expire mid-task and verify state restoration after login."]
        common_fixes: ["Autosave drafts, restore state, refresh tokens."]

      - id: "2.2.6"
        title: "Timeouts"
        level: "AAA"
        description: >
          Users must be warned about inactivity timeouts that could result in data loss, unless data is preserved
          for more than 20 hours without user action.
        examples:
          pass: ["Warns: 'You will be signed out after 10 minutes of inactivity' and allows extension."]
          fail: ["Logs out for inactivity with no warning and data loss."]
        how_to_test: ["Verify timeout warnings/controls and data preservation behavior."]
        common_fixes: ["Warn before timeout, preserve data, allow extending the session."]

      - id: "2.3.2"
        title: "Three Flashes"
        level: "AAA"
        description: "Do not include any content that flashes more than three times per second."
        examples:
          pass: ["No rapid flashing content."]
          fail: ["Animation flashes >3 times per second."]
        how_to_test: ["Review animations; use flash testing tools if needed."]
        common_fixes: ["Remove flashing or replace with safer transitions."]

      - id: "2.4.8"
        title: "Location"
        level: "AAA"
        description: "Provide information about the user's location within a set of pages (e.g., breadcrumbs)."
        examples:
          pass: ["Breadcrumbs: Home > Products > Details."]
          fail: ["No location indicator in a deep information architecture."]
        how_to_test: ["Verify breadcrumbs or equivalent location indicators on internal pages."]
        common_fixes: ["Add breadcrumbs with appropriate semantics."]

      - id: "2.4.9"
        title: "Link Purpose (Link Only)"
        level: "AAA"
        description: "The purpose of each link must be determinable from the link text alone (without surrounding context)."
        examples:
          pass: ["“Download Invoice 12345 (PDF)” as the link text."]
          fail: ["Multiple links labeled “Details” with no disambiguation in the text itself."]
        how_to_test: ["Review links out of context (e.g., link list): is each still clear?"]
        common_fixes: ["Make link text unique and self-describing; include object/action."]

      - id: "2.4.10"
        title: "Section Headings"
        level: "AAA"
        description: "Use section headings to organize content where appropriate."
        examples:
          pass: ["Long pages have clear headings for each logical section."]
          fail: ["Long content has no heading structure."]
        how_to_test: ["Navigate by headings and confirm meaningful structure."]
        common_fixes: ["Add h2/h3 headings and maintain correct hierarchy."]

      - id: "2.5.5"
        title: "Target Size"
        level: "AAA"
        description: "Ensure pointer targets are sufficiently large (AAA-level target size requirement)."
        examples:
          pass: ["Controls have large hit areas and adequate spacing."]
          fail: ["Targets are small and tightly packed."]
        how_to_test: ["Evaluate target size and spacing on mobile/touch contexts."]
        common_fixes: ["Increase padding/spacing; redesign dense controls."]

      - id: "2.5.6"
        title: "Concurrent Input Mechanisms"
        level: "AAA"
        description: "Do not restrict the use of multiple input mechanisms concurrently unless essential."
        examples:
          pass: ["Works with keyboard + mouse + touch + assistive tech without disabling any mode."]
          fail: ["Enabling touch mode disables keyboard navigation unnecessarily."]
        how_to_test: ["Test combinations of inputs and AT for conflicts or forced modes."]
        common_fixes: ["Remove input-mode locks; handle multiple event sources appropriately."]

      - id: "3.1.3"
        title: "Unusual Words"
        level: "AAA"
        description: "Provide mechanisms to identify definitions for unusual words, idioms, or jargon."
        examples:
          pass: ["Glossary or inline definitions for domain terms."]
          fail: ["Jargon-heavy content with no explanations."]
        how_to_test: ["Identify uncommon terms and confirm definitions are available."]
        common_fixes: ["Add glossary, tooltips, or explanatory links."]

      - id: "3.1.4"
        title: "Abbreviations"
        level: "AAA"
        description: "Provide a mechanism for identifying the expanded form or meaning of abbreviations."
        examples:
          pass: ["<abbr title='Service Level Agreement'>SLA</abbr> (or equivalent)."]
          fail: ["Abbreviations are never expanded or explained."]
        how_to_test: ["Review abbreviations and confirm expansions are provided at first use or via markup."]
        common_fixes: ["Use <abbr>, expand at first occurrence, provide a glossary."]

      - id: "3.1.5"
        title: "Reading Level"
        level: "AAA"
        description: >
          When text requires advanced reading ability, provide supplemental content or an alternative version
          that does not require advanced reading ability.
        examples:
          pass: ["Plain-language summary plus full technical details."]
          fail: ["Only complex legal/technical text with no support."]
        how_to_test: ["Assess complexity and availability of simplified alternatives or summaries."]
        common_fixes: ["Add summaries, simplify language, provide explanations/examples."]

      - id: "3.1.6"
        title: "Pronunciation"
        level: "AAA"
        description: "Provide a mechanism to identify specific pronunciation of words where meaning is ambiguous without it."
        examples:
          pass: ["Glossary includes pronunciation guidance for ambiguous terms/names."]
          fail: ["Ambiguous words where pronunciation changes meaning are not supported."]
        how_to_test: ["Identify ambiguous terms and confirm a pronunciation mechanism exists where needed."]
        common_fixes: ["Add pronunciation notes, audio, or glossary entries as appropriate."]

      - id: "3.2.5"
        title: "Change on Request"
        level: "AAA"
        description: "Changes of context must be initiated only by user request."
        examples:
          pass: ["Updates occur only after user clicks “Refresh” or “Apply”."]
          fail: ["Auto-redirect or auto-refresh happens without user action."]
        how_to_test: ["Observe for automatic redirects/updates; confirm user control is required."]
        common_fixes: ["Make changes user-initiated; provide settings to disable auto-updates."]

      - id: "3.3.5"
        title: "Help"
        level: "AAA"
        description: "Provide context-sensitive help for completing and submitting information."
        examples:
          pass: ["Complex fields provide help text, examples, and a help link."]
          fail: ["Complex process provides no guidance or help."]
        how_to_test: ["Check whether help is available where users commonly need it (forms, complex steps)."]
        common_fixes: ["Add inline help, examples, FAQs, and support contact mechanisms."]

      - id: "3.3.6"
        title: "Error Prevention (All)"
        level: "AAA"
        description: >
          For all data submissions, provide at least one of: reversibility, opportunity to correct errors,
          or a review/confirmation step before finalizing.
        examples:
          pass:
            - "Final review screen with confirm + ability to go back and edit."
            - "Submission is reversible via undo within a time window."
          fail:
            - "Irreversible submission with no review and no correction path."
        how_to_test:
          - "Attempt a submission and verify review/confirm, undo, or robust correction mechanisms."
        common_fixes:
          - "Add review step, undo window, and strong validation with guided corrections."

metadata:
  notes:
    - "In WCAG 2.2, SC 4.1.1 Parsing is removed; do not include it in checks."
